name: Feedback or feature request
description: Share feedback or report a bug in the app, extensions or website, including ideas for upcoming browsers.
body:
  - type: markdown
    attributes:
      value: |
        This form creates a **public issue** for app, extension or website feedback.
        Options marked **Coming soon** are for upcoming extensions, not available downloads.
        Don't include private highlights, access tokens, account details or other sensitive information.
        For private support, use the email address on the [support page](https://mubranch.github.io/TwineWebsite/support).
  - type: dropdown
    id: kind
    attributes:
      label: What would you like to share?
      options:
        - Feature request
        - Bug report
        - General feedback
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: What is this about?
      options:
        - Twine for Mac
        - Twine for iPhone
        - Safari extension on Mac
        - Safari extension on iPhone
        - Chrome or Chromium-based extension on Mac (Coming soon)
        - Firefox extension on Mac (Coming soon)
        - Twine website
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Your feedback
      description: Describe your idea or the problem you want to solve. For bugs, include the steps, what you expected and what happened.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would help?
      description: If you have a feature or solution in mind, describe how it would help.
  - type: textarea
    id: environment
    attributes:
      label: Device, app and browser versions
      description: For bugs, include your device, OS and Twine versions. For extension feedback, add the browser name, browser version and extension version if available. Leave out serial numbers, account details and other personal identifiers.
